name = "mamandyq-ai"
main = "src/index.js"
compatibility_date = "2026-09-30"

[vars]
# GitHub Pages project URL-дың PATH бөлігін жазбаңыз. Origin ғана: https://USERNAME.github.io
ALLOWED_ORIGINS = "https://mrasqarovv-ai.github.io"
OPENAI_MODEL = "gpt-5.6-luna"
MAX_OUTPUT_TOKENS = "900"

[[ratelimits]]
name = "AI_RATE_LIMITER"
namespace_id = "12001"
  [ratelimits.simple]
  limit = 12
  period = 60

[[ratelimits]]
name = "GLOBAL_RATE_LIMITER"
namespace_id = "12002"
  [ratelimits.simple]
  limit = 200
  period = 60

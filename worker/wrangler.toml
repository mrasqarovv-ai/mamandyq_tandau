name = "orleu-results-bot"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://mrasqarovv-ai.github.io"

[[d1_databases]]
binding = "DB"
database_name = "orleu-results"
# Replace only this non-secret ID after `wrangler d1 create orleu-results`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
crons = ["*/5 * * * *"]

# Set with `npx wrangler secret put NAME`, never commit values:
# BOT_TOKEN                 Telegram BotFather token
# TEACHER_CHAT_ID           Teacher chat ID (a secret for privacy)
# TURNSTILE_SECRET_KEY      Cloudflare Turnstile server verification key
# TELEGRAM_WEBHOOK_SECRET   Optional random 32+ character webhook secret

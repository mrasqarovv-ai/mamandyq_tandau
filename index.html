function stepComplete(s){if(['grade','pair','relocation'].includes(s.type))return !!app.answers[s.key];if(s.type==='after9')return !!app.answers.after9;if(s.type==='score')return app.answers.score!==undefined;if(s.type==='city')return !!app.answers.preferredCity;if(s.type==='family')return (app.answers.familyPriorities||[]).length===3;if(s.type==='values')return (app.answers.values||[]).length===3;if(s.type==='prefs')return PREF_Q.every(q=>(app.answers.prefs||{})[q.k]);if(s.type==='interestMatrix')return s.items.every(it=>app.answers[`i_${it.ck}_${it.i}`]);if(s.type==='abilityQuiz')return s.items.every((q,j)=>app.answers[`aq_${s.offset+j}`]!==undefined);if(s.type==='abilityRate')return ['logic','math','verbal','attention'].every(k=>app.answers[`ar_${k}`]);return true}

function weightedClusterMatch(prof,ints){let num=0,den=0;for(const [k,w] of Object.entries(prof.clusters)){if(ints[k]!=null){num+=ints[k]*w;den+=w}}return den?num/den:50}

function valueMatch(prof,vals){if(!vals.length)return 50;let hit=vals.filter(v=>prof.values.includes(v)).length;return 35+65*hit/vals.length}

function rankProfessions(p){return PROFS.map(prof=>{let i=weightedClusterMatch(prof,p.interests),a=abilityMatch(prof,p.abilities),v=valueMatch(prof,p.values),pr=prefMatch(prof,p.prefs),sub=subjectMatch(prof,p);let weights=p.grade==='9'?{i:.45,a:.25,v:.15,pr:.15,sub:0}:{i:.40,a:.20,v:.15,pr:.15,sub:.10};let total=i*weights.i+a*weights.a+v*weights.v+pr*weights.pr+sub*weights.sub;return {id:prof.id,score:Math.round(total),parts:{interests:Math.round(i),abilities:Math.round(a),values:Math.round(v),prefs:Math.round(pr),subjects:sub}}}).sort((a,b)=>b.score-a.score)}
function histStatus(score,h){if(!score||!h)return {k:'none',text:t('noScore')};if(score>=h.q75)return {k:'ok',text:app.lang==='kk'?'Тарихи 75-процентильден жоғары/тең':app.lang==='ru'?'Не ниже исторического 75-го процентиля':'At/above historical 75th percentile'};if(score>=h.median)return {k:'ok',text:app.lang==='kk'?'Тарихи медианадан жоғары/тең':app.lang==='ru'?'Не ниже исторической медианы':'At/above historical median'};if(score>=h.min)return {k:'warn',text:app.lang==='kk'?'Тарихи диапазон ішінде':app.lang==='ru'?'Внутри исторического диапазона':'Within historical range'};if(score>=h.min-5)return {k:'warn',text:app.lang==='kk'?`Тарихи минимумға ${h.min-score} балл жетпейді`:app.lang==='ru'?`До исторического минимума ${h.min-score} балл(а)`: `${h.min-score} points below historical minimum`};return {k:'bad',text:app.lang==='kk'?'Тарихи минимумнан төмен':app.lang==='ru'?'Ниже исторического минимума':'Below historical minimum'}}

function recommendedPairs(p){let pairs={};for(const r of p.professions.slice(0,8)){let prof=PROFS.find(x=>x.id===r.id);for(const b of prof.bcodes){let pr=PROGRAMS.find(x=>x.code===b);for(const pa of pr?.pairs||[])pairs[pa]=(pairs[pa]||0)+r.score}}return Object.entries(pairs).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0])}
function topCompatiblePrograms(p){let codes=[];for(const r of p.professions.slice(0,6)){let prof=PROFS.find(x=>x.id===r.id);for(const b of prof.bcodes){let pr=PROGRAMS.find(x=>x.code===b);if(pr&&(p.grade==='9'||p.pair==='undecided'||(pr.pairs||[]).includes(p.pair)))codes.push(pr)}}return [...new Map(codes.map(x=>[x.code,x])).values()].slice(0,8)}
function renderRoute(){let cur=getCurrentProfile();if(!cur){$('route').innerHTML=`<h2>${t('routeTitle')}</h2><p>${t('incomplete')}</p>`;return}let p=cur.profile,top=PROFS.find(x=>x.id===p.professions[0].id),progs=topCompatiblePrograms(p);let h=`<h2>${t('routeTitle')}</h2><div class="card"><h3>1. ${app.lang==='kk'?'Кәсіби бағыт':app.lang==='ru'?'Профессиональное направление':'Career direction'}</h3><b>${L(top.name)}</b><p>${L(top.desc)}</p></div>`;if(p.grade==='9'){let pairs=recommendedPairs(p);h+=`<div class="card"><h3>2A. 10–11</h3><p>${app.lang==='kk'?'Ұсынысты мамандықтарға жиі апаратын пән жұптары:':app.lang==='ru'?'Пары предметов, часто ведущие к рекомендованным профессиям:':'Subject pairs that often lead to recommended careers:'}</p>${pairs.map(x=>`<span class="tag">${pairName(x)}</span>`).join('')}</div><div class="card"><h3>2B. ${t('colleges')}</h3><p>${t('inferredCollege')}</p><button class="btn alt" onclick="go('colleges')">${t('navCollege')}</button></div>`}else{h+=`<div class="card"><h3>2. ${t('pair')}</h3><b>${pairName(p.pair)}</b><p>${progs.length?(app.lang==='kk'?`Бұл жұп ұсынылған бағыттардан ${progs.length} B-топты ашады.`:app.lang==='ru'?`Эта пара открывает ${progs.length} подходящих B-групп.`:`This pair opens ${progs.length} matching B-groups.`):(app.lang==='kk'?'Таңдалған пән жұбы негізгі ұсыныстардың B-топтарымен сәйкес келмейді.':app.lang==='ru'?'Выбранная пара не совпадает с B-группами основных рекомендаций.':'The selected subject pair does not match the main recommended B-groups.')}</p></div><div class="card"><h3>3. ${t('historical')}</h3>${progs.slice(0,5).map(pr=>{let hs=histStatus(p.score,pr.hist);return `<p><b>${pr.code} ${programName(pr)}</b><br><span class="status ${hs.k}">${hs.text}</span>${pr.hist?` · ${t('min')} ${pr.hist.min}, ${t('median')} ${pr.hist.median}, ${t('q75')} ${pr.hist.q75}`:''}</p>`}).join('')}</div>`}h+=`<div class="card"><h3>${p.grade==='11'?'4':'3'}. ${app.lang==='kk'?'Келесі әрекеттер':app.lang==='ru'?'Следующие действия':'Next actions'}</h3>${nextActions(p,progs).map(x=>`<label class="check"><input type="checkbox"><span>${x}</span></label>`).join('')}</div>`;$('route').innerHTML=h}
function nextActions(p,progs){let a=[];if(p.grade==='9'){a.push(app.lang==='kk'?'2 негізгі кәсіби бағытты отбасымен талқылау':app.lang==='ru'?'Обсудить с семьёй 2 основных профессиональных направления':'Discuss 2 main career directions with family');a.push(app.lang==='kk'?'10–11 сынып немесе колледж маршрутын салыстыру':app.lang==='ru'?'Сравнить маршрут 10–11 класса и колледжа':'Compare grades 10–11 and college routes');a.push(app.lang==='kk'?'Ұсынылған пән жұптарының мектепте қолжетімділігін тексеру':app.lang==='ru'?'Проверить доступность рекомендованных профильных пар в школе':'Check whether recommended subject pairs are available at school');return a}a.push(app.lang==='kk'?`Таңдалған ${pairName(p.pair)} жұбы негізгі мақсаттарға сәйкес келе ме — тексеру`:app.lang==='ru'?`Проверить, соответствует ли пара ${pairName(p.pair)} основным целям`:`Check whether ${pairName(p.pair)} matches the main goals`);if(p.score){let meds=progs.filter(x=>x.hist).map(x=>x.hist.median);if(meds.length){let med=Math.round(meds.reduce((x,y)=>x+y,0)/meds.length);a.push(app.lang==='kk'?`Нысана ретінде тарихи медиананы (${med} шамасында) бақылау, бірақ оны кепілдік деп қабылдамау`:app.lang==='ru'?`Ориентироваться на историческую медиану (~${med}), не считая её гарантией`:`Track the historical median (~${med}) as a reference, not a guarantee`)}}else a.push(app.lang==='kk'?'Сынама ҰБТ нәтижесін енгізіп, тарихи салыстыруды жаңарту':app.lang==='ru'?'Ввести пробный балл ЕНТ и обновить историческое сравнение':'Enter a trial UNT score and update the historical comparison');a.push(app.lang==='kk'?'3–5 нақты ЖОО-ны B-код бойынша салыстыру':app.lang==='ru'?'Сравнить 3–5 конкретных вузов по B-коду':'Compare 3–5 universities by exact B-code');return a}
function renderCompare(){if(!(profiles.student&&profiles.parent)){$('compare').innerHTML=`<h2>${t('compareTitle')}</h2><div class="card"><p>${t('noCompare')}</p></div>`;return}let s=profiles.student.profile,p=profiles.parent.profile;let rows=CLUSTERS.map(c=>{let k=c[0],d=(s.interests[k]??0)-(p.interests[k]??0);return {k,sv:s.interests[k],pv:p.interests[k],d}}).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));let st=s.professions.slice(0,5).map(x=>x.id),pt=p.professions.slice(0,5).map(x=>x.id),common=st.filter(x=>pt.includes(x));$('compare').innerHTML=`<h2>${t('compareTitle')}</h2><p class="mu">${app.lang==='kk'?'Айырмашылық «кім дұрыс?» деген баға емес; ол талқылауға арналған белгі.':app.lang==='ru'?'Разница не показывает, «кто прав»; это повод для обсуждения.':'A difference does not show who is “right”; it is a discussion signal.'}</p><div class="tableWrap"><table><thead><tr><th>${t('profile')}</th><th>${t('student')}</th><th>${t('parent')}</th><th>Δ</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${clusterName(r.k)}</td><td>${r.sv}</td><td>${r.pv}</td><td class="compareDelta">${r.d>0?'+':''}${r.d}</td></tr>`).join('')}</tbody></table></div><div class="card"><h3>${app.lang==='kk'?'Екі профильде де ТОП-5-ке кірген мамандықтар':app.lang==='ru'?'Профессии, попавшие в ТОП-5 обоих профилей':'Careers appearing in both top-5 lists'}</h3>${common.length?common.map(id=>`<span class="tag ok">${L(PROFS.find(x=>x.id===id).name)}</span>`).join(' '):`<p class="mu">${app.lang==='kk'?'Ортақ мамандық жоқ — айырмашылықты бірге талқылаған пайдалы.':app.lang==='ru'?'Совпадений нет — полезно обсудить различия.':'No overlap — discussing the differences may be useful.'}</p>`}</div>`}
function renderAbout(){$('about').innerHTML=`<h2>${t('methodTitle')}</h2><div class="card"><h3>${app.lang==='kk'?'Құрылым':app.lang==='ru'?'Структура':'Structure'}</h3><p>${app.lang==='kk'?'Рөл → сынып → қызығушылық → қабілет → құндылық → жұмыс стилі → нақты мамандық → B-топ → бейіндік пән → тарихи грант статистикасы → ЖОО/колледж → жеке маршрут.':app.lang==='ru'?'Роль → класс → интересы → способности → ценности → стиль работы → конкретная профессия → B-группа → профильные предметы → историческая статистика грантов → вуз/колледж → персональный маршрут.':'Role → grade → interests → abilities → values → work style → specific career → B-group → profile subjects → historical grant statistics → university/college → personal route.'}</p></div><div class="card"><h3>${t('fit')}</h3><p>${app.lang==='kk'?'9-сыныпта: қызығушылық 45%, қабілет 25%, құндылық 15%, жұмыс стилі 15%. 10–11 сыныпта: 40% + 20% + 15% + 15% + бейіндік пән сәйкестігі 10%. Бұл салмақтар ашық көрсетілген MVP гипотезасы, ғылыми нормаланған тест емес.':app.lang==='ru'?'В 9 классе: интересы 45%, способности 25%, ценности 15%, стиль 15%. В 10–11: 40% + 20% + 15% + 15% + 10% соответствия профильным предметам. Это прозрачная гипотеза MVP, а не стандартизированный психометрический тест.':'Grade 9: interests 45%, abilities 25%, values 15%, work style 15%. Grades 10–11: 40% + 20% + 15% + 15% + 10% profile-subject fit. These are transparent MVP assumptions, not a standardized psychometric test.'}</p><p class="note">${t('methodCaveat')}</p></div><div class="card"><h3>${t('historical')}</h3><p>${t('generalOnly')}</p><p>${app.lang==='kk'?`Негізгі ұлттық бөлімнен ${Object.values(PROGRAMS).filter(x=>x.hist).length} B-топ және жалпы конкурс жолдары агрегатталды. Әр B-топ үшін Қазақстан бойынша және әр ЖЖОКБҰ коды бойынша minimum, Q1, median, Q3, maximum және грант саны есептеледі.`:app.lang==='ru'?`Из основной национальной части агрегированы B-группы и строки общего конкурса. Для каждой группы и каждого кода ОВПО рассчитываются minimum, Q1, median, Q3, maximum и число грантов.`:`The main national section is aggregated by B-group and university code, with minimum, Q1, median, Q3, maximum and grant count.`}</p><p>${t('notProbability')}</p></div><div class="card"><h3>${app.lang==='kk'?'Дерек шектеулері':app.lang==='ru'?'Ограничения данных':'Data limitations'}</h3><ul><li>${app.lang==='kk'?'PDF тақырыбында 2026–2027 оқу жылы көрсетілген; сайт осы жылды қолданады.':app.lang==='ru'?'В заголовке PDF указан 2026–2027 учебный год; сайт использует этот год.':'The PDF title states academic year 2026–2027; the site uses that year.'}</li><li>${t('unknownUni')}</li><li>${t('inferredCollege')}</li><li>${app.lang==='kk'?'ЖОО беделі, оқу ақысы және еңбек нарығы дерегі бастапқы файлдарда жоқ, сондықтан рейтингке ойдан қосылмайды.':app.lang==='ru'?'Рейтинг вуза, стоимость обучения и данные рынка труда отсутствуют в исходных файлах и не выдумываются.':'University prestige, tuition and labor-market data are not present in the source files and are not invented.'}</li></ul></div>`}
function renderAll(){document.documentElement.lang=app.lang;$('langSel').value=app.lang;const rights=app.lang==='kk'?'Барлық құқықтар қорғалған.':app.lang==='ru'?'Все права защищены.':'All rights reserved.';$('footer').innerHTML=`© 2026 <b>Бағыт</b>. ${rights}`;nav();applyTheme(currentTheme(),false);({home:renderHome,survey:renderSurvey,result:renderResult,professions:renderProfessions,programs:renderPrograms,universities:renderUniversities,colleges:renderColleges,route:renderRoute,compare:renderCompare,about:renderAbout}[app.section]||renderHome)()}
$('langSel').addEventListener('change',e=>{app.lang=e.target.value;localStorage.setItem('cn6_lang',app.lang);renderAll()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')toggleBurger(false)});
renderAll();
</script>

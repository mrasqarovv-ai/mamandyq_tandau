name: Upgrade Career Navigator to v12 AI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html for AI, analytics, SEO and branding
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = s

          if 'assets/ai-assistant.css' not in s:
              s = s.replace('</head>', '<link rel="stylesheet" href="assets/ai-assistant.css">\n</head>', 1)
          if 'assets/analytics.css' not in s:
              s = s.replace('</head>', '<link rel="stylesheet" href="assets/analytics.css">\n</head>', 1)
          if 'assets/ai-assistant.js' not in s:
              s = s.replace('</body>', '<script src="config.js"></script>\n<script src="assets/ai-assistant.js"></script>\n</body>', 1)
          if 'assets/analytics.js' not in s:
              s = s.replace('</body>', '<script src="assets/analytics.js"></script>\n</body>', 1)

          # Brand: keep only “Бағыт” in visible UI.
          s = s.replace('🧭 Бағыт · Career Navigator', '🧭 Бағыт')
          s = s.replace('Бағыт · Career Navigator', 'Бағыт')
          s = s.replace('<span>Career Navigator</span>', '<span>Бағыт</span>')
          s = s.replace('content="Career Navigator"', 'content="Бағыт"')

          # Homepage headline/subheadline.
          s = s.replace("hero:'Қызығушылықтан — нақты білім маршрутына'", "hero:'Өз бағытыңды тап'")
          s = s.replace("lead:'Оқушының немесе ата-ананың жауаптарын қызығушылық, қабілет, құндылық, жұмыс стилі, бейіндік пәндер және тарихи грант деректерімен байланыстыратын түсіндірілетін навигатор.'", "lead:'Қызығушылығың мен қабілетіңе сай мамандықты анықтап, оқу бағыты, ЖОО және грант мүмкіндіктерін бір жерден көр.'")
          s = s.replace("hero:'От интересов — к конкретному образовательному маршруту'", "hero:'Найди своё направление'")
          s = s.replace("lead:'Навигатор связывает ответы ученика или родителя с интересами, способностями, ценностями, стилем работы, профильными предметами и историческими данными грантов.'", "lead:'Определи профессию по своим интересам и способностям и изучи направления обучения, вузы и возможности гранта в одном месте.'")
          s = s.replace("hero:'From interests to a concrete education route'", "hero:'Find your direction'")
          s = s.replace("lead:'The navigator links student or parent answers with interests, abilities, values, work style, profile subjects and historical grant data.'", "lead:'Discover careers that match your interests and abilities, then explore study paths, universities and grant opportunities in one place.'")

          # Useful visible wording that also tells Google what the product does.
          s = s.replace("who:'Сауалнаманы кім толтырады?'", "who:'Кәсіби бағдар сауалнамасын кім толтырады?'")
          s = s.replace("start:'Сауалнаманы бастау'", "start:'Кәсіби бағдар тестін бастау'")
          s = s.replace("who:'Кто заполняет опрос?'", "who:'Кто проходит тест профориентации?'")
          s = s.replace("start:'Начать опрос'", "start:'Начать тест профориентации'")
          s = s.replace("who:'Who is completing the survey?'", "who:'Who is taking the career guidance test?'")
          s = s.replace("start:'Start survey'", "start:'Start career guidance test'")

          # Search-focused metadata. Google does not rely on meta keywords alone,
          # so the same topics also appear naturally in visible interface text above.
          s = re.sub(r'<title>.*?</title>', '<title>Бағыт — мамандық таңдау тесті, кәсіби бағдар, ЖОО және грант</title>', s, count=1, flags=re.S)
          s = re.sub(r'<meta name="description" content="[^"]*">', '<meta name="description" content="Бағыт — Қазақстан оқушыларына арналған мамандық таңдау және кәсіби бағдар платформасы. Мамандық таңдау тестін өтіп, бейіндік пәндер, ҰБТ, білім беру бағдарламалары, ЖОО және грант мүмкіндіктерін зерттеңіз.">', s, count=1)
          s = re.sub(r'<meta name="keywords" content="[^"]*">', '<meta name="keywords" content="мамандық таңдау, мамандық таңдау тесті, кәсіби бағдар, кәсіби бағдар тесті, профориентация, ҰБТ, ҰБТ мамандық таңдау, ЖОО, университет таңдау, грант, грантқа түсу, білім беру бағдарламасы, Қазақстан, 9 сынып мамандық таңдау, 10 сынып мамандық таңдау, 11 сынып мамандық таңдау, абитуриент">', s, count=1)
          s = re.sub(r'<meta property="og:title" content="[^"]*">', '<meta property="og:title" content="Бағыт — мамандық таңдау тесті және кәсіби бағдар">', s, count=1)
          s = re.sub(r'<meta property="og:description" content="[^"]*">', '<meta property="og:description" content="Мамандық таңдау тесті, кәсіби бағдар, ҰБТ, ЖОО және грант мүмкіндіктері — Қазақстан оқушыларына арналған бір платформада.">', s, count=1)
          s = re.sub(r'<meta name="twitter:title" content="[^"]*">', '<meta name="twitter:title" content="Бағыт — мамандық таңдау тесті және кәсіби бағдар">', s, count=1)
          s = re.sub(r'<meta name="twitter:description" content="[^"]*">', '<meta name="twitter:description" content="Мамандық таңдау, кәсіби бағдар, ҰБТ, ЖОО және грант мүмкіндіктері.">', s, count=1)

          # Keep structured data search-friendly.
          s = re.sub(
              r'<script type="application/ld\+json">.*?</script>',
              '<script type="application/ld+json">\n{"@context":"https://schema.org","@type":"WebApplication","name":"Бағыт","alternateName":"Bagyt","url":"https://mrasqarovv-ai.github.io/mamandyq_tandau/","applicationCategory":"EducationalApplication","operatingSystem":"Web","inLanguage":["kk","ru","en"],"description":"Қазақстан оқушыларына мамандық таңдау, кәсіби бағдар, ҰБТ, ЖОО және грант мүмкіндіктерін зерттеуге көмектесетін платформа.","keywords":"мамандық таңдау, мамандық таңдау тесті, кәсіби бағдар, кәсіби бағдар тесті, ҰБТ, ЖОО, грант, Қазақстан","isAccessibleForFree":true}\n</script>',
              s,
              count=1,
              flags=re.S
          )

          if s != old:
              p.write_text(s, encoding='utf-8')
          else:
              print('index.html already up to date')
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable Bagyt analytics and feedback"
          git push
